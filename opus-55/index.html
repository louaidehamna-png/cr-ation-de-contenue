<!doctype html>
<html lang="fr" data-resolution="portrait">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="assets/gsap.min.js"></script>
<script type="importmap">
{ "imports": { "three": "./assets/three.module.js", "three/addons/": "./assets/jsm/" } }
</script>
<style>
@font-face{font-family:"InterX";font-weight:900;src:url("assets/fonts/Inter-Black.otf") format("opentype")}
@font-face{font-family:"InterX";font-weight:700;src:url("assets/fonts/Inter-Bold.otf") format("opentype")}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#12002e}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:"InterX",sans-serif;color:#fff}
#gl{position:absolute;left:0;top:0;width:1080px;height:1920px;display:block}
.t{position:absolute;left:0;width:1080px;text-align:center;font-weight:900;letter-spacing:-.03em;opacity:0;
   text-shadow:0 6px 0 rgba(0,0,0,.35),0 0 40px rgba(0,0,0,.45)}
#t-claude{top:330px;font-size:84px;letter-spacing:.18em}
#t-opus{top:420px;font-size:250px;line-height:1}
#t-55{top:675px;font-size:200px;line-height:1;color:#ffe600}
.w{position:absolute;left:0;width:1080px;top:1300px;text-align:center;font:900 150px/1 "InterX";letter-spacing:-.03em;opacity:0;
   text-shadow:0 6px 0 rgba(0,0,0,.35),0 0 40px rgba(0,0,0,.45)}
#w1{color:#00f0ff}#w2{color:#ffe600}#w3{color:#ff3df2}#w4{color:#7dff3a}
#e-q{top:330px;font-size:120px}
#e-code{top:490px;font-size:150px;color:#ffe600}
#e-by{top:1270px;font-size:72px;letter-spacing:.14em}
#e-name{top:1360px;font-size:150px;line-height:1}
#e-name b{color:#00f0ff}
#flash{position:absolute;inset:0;background:#fff;opacity:0}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1080" data-height="1920">
  <canvas id="gl" width="1080" height="1920"></canvas>
  <div id="t-claude" class="t">CLAUDE</div>
  <div id="t-opus" class="t">OPUS</div>
  <div id="t-55" class="t">5.5</div>
  <div id="w1" class="w">écrit.</div>
  <div id="w2" class="w">code.</div>
  <div id="w3" class="w">anime.</div>
  <div id="w4" class="w">en 3D.</div>
  <div id="flash"></div>
  <div id="e-q" class="t">Cette vidéo&#8239;?</div>
  <div id="e-code" class="t">100&#8239;% code.</div>
  <div id="e-by" class="t">FAITE PAR</div>
  <div id="e-name" class="t">Opus <b>5.5</b></div>
  <audio id="sfx" src="assets/audio/sfx.wav" data-start="0" data-duration="6" data-track-index="5"></audio>
</div>
<script type="module">
import * as THREE from "three";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

const W=1080,H=1920;
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById("gl"),antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(1);renderer.setSize(W,H,false);
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(42,W/H,.1,200);
const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(W/2,H/2),.55,.5,.72);composer.addPass(bloom);
composer.addPass(new OutputPass());

scene.add(new THREE.HemisphereLight(0xffffff,0x3a0080,1.6));
const key=new THREE.DirectionalLight(0xffffff,2.6);key.position.set(4,6,8);scene.add(key);
const rim=new THREE.PointLight(0x00f0ff,60,30);rim.position.set(-5,-3,4);scene.add(rim);
const rim2=new THREE.PointLight(0xff3df2,60,30);rim2.position.set(5,2,-3);scene.add(rim2);

/* palette vive */
const PAL=[0xff3df2,0x00f0ff,0xffe600,0x7dff3a,0xff6a00,0x8a5cff];
const BG=[[0.0,"#3b0aa8"],[1.6,"#6a00d8"],[3.6,"#d1007a"],[4.1,"#ff5a00"],[6.0,"#e0006e"]];

/* le noeud central : l'objet-pont (on plonge dedans au milieu du film) */
const knot=new THREE.Mesh(new THREE.TorusKnotGeometry(1.25,.42,260,40,2,3),
  new THREE.MeshPhysicalMaterial({color:0xff3df2,roughness:.18,metalness:.15,clearcoat:1,clearcoatRoughness:.1,emissive:0x5a0050,emissiveIntensity:.6}));
scene.add(knot);

/* satellites : géométries simples, positions tirées d'un générateur à graine (rendu identique à chaque image) */
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
const geos=[new THREE.IcosahedronGeometry(.32,0),new THREE.BoxGeometry(.42,.42,.42),new THREE.SphereGeometry(.26,32,16),new THREE.TorusGeometry(.26,.1,16,40),new THREE.OctahedronGeometry(.34,0)];
const sats=[];
for(let i=0;i<34;i++){
  const c=PAL[i%PAL.length];
  const m=new THREE.Mesh(geos[i%geos.length],new THREE.MeshStandardMaterial({color:c,roughness:.3,metalness:.1,emissive:c,emissiveIntensity:.35}));
  const s={m,r:2.6+rnd()*2.6,a:rnd()*Math.PI*2,y:(rnd()-.5)*5.2,sp:(.35+rnd()*.5)*(rnd()<.5?-1:1),d:.04*i%1.2,spin:rnd()*3,sc:.7+rnd()*.8};
  scene.add(m);sats.push(s);
}
const ease=t=>t<0?0:t>1?1:1-Math.pow(1-t,3);
const back=t=>{if(t<=0)return 0;if(t>=1)return 1;const c=1.9;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
const lerp=(a,b,t)=>a+(b-a)*t;
function bgAt(t){let i=0;while(i<BG.length-2&&t>BG[i+1][0])i++;const [t0,c0]=BG[i],[t1,c1]=BG[i+1];
  return new THREE.Color(c0).lerp(new THREE.Color(c1),Math.min(1,Math.max(0,(t-t0)/(t1-t0))))}

function renderAt(t){
  scene.background=bgAt(t);
  /* caméra : toujours en mouvement. Poussée lente, plongée dans le noeud (3.55-4.1), puis recul lent */
  let z,y=.4;
  if(t<3.55){z=lerp(13.5,10.2,t/3.55)}
  else if(t<4.1){z=lerp(10.2,1.6,ease((t-3.55)/.55))}
  else {z=lerp(7.2,8.6,(t-4.1)/1.9)}
  camera.position.set(Math.sin(t*.5)*1.2,y+Math.sin(t*.7)*.3,z);camera.lookAt(0,.1,0);
  /* noeud : arrive en rebond, tourne, change de couleur à la plongée */
  const ks=t<4.1?back(t/.55):lerp(.55,1,back((t-4.1)/.6));
  knot.scale.setScalar(Math.max(.001,ks*1.15));
  knot.rotation.set(t*.9,t*1.3,0);
  knot.material.color.set(t<3.8?0xff3df2:0x00f0ff);knot.material.emissive.set(t<3.8?0x5a0050:0x004a55);
  /* satellites : jaillissent du centre puis orbitent ; seconde salve à 5.55 */
  sats.forEach((s,i)=>{
    const k=back((t-.1-s.d*.5)/.6), k2=t>5.55?ease((t-5.55)/.4):0;
    const r=s.r*k*(1+k2*.35), a=s.a+t*s.sp;
    s.m.position.set(Math.cos(a)*r,s.y*k,Math.sin(a)*r*.8);
    s.m.rotation.set(t*s.spin,t*s.spin*.7,0);
    s.m.scale.setScalar(Math.max(.001,s.sc*Math.min(1,k)*(1+k2*.25)));
  });
  bloom.strength=.55+(t>3.5&&t<4.2?.9*Math.sin(Math.PI*(t-3.5)/.7):0);
  composer.render();
}

/* une seule horloge : la timeline GSAP ; sa propriété t redessine la scène 3D */
const T={_t:0,get t(){return this._t},set t(v){this._t=v;renderAt(v)}};
const tl=gsap.timeline({paused:true});
tl.fromTo(T,{t:0},{t:6,duration:6,ease:"none",immediateRender:false},0);
function pop(sel,t,out,from){tl.fromTo(sel,Object.assign({opacity:0,scale:1.6,y:0},from||{}),{opacity:1,scale:1,y:0,x:0,duration:.22,ease:"back.out(2.2)",immediateRender:false},t);
  if(out!=null)tl.to(sel,{opacity:0,scale:.85,duration:.14,ease:"power2.in"},out)}
pop("#t-claude",.15,3.45,{y:-60,scale:1});
pop("#t-opus",.6,3.45,{scale:2.4});
pop("#t-55",1.1,3.45,{scale:2.6,rotation:-8});
/* mots : un toutes les 0,5 s, chacun chasse le précédent */
[["#w1",1.7],["#w2",2.2],["#w3",2.7],["#w4",3.2]].forEach(([s,t],i)=>pop(s,t,t+.46,{y:80,scale:1.3}));
tl.fromTo("#t-opus",{scale:1},{scale:1.08,duration:2.6,ease:"none",immediateRender:false},.82);
tl.fromTo("#flash",{opacity:0},{opacity:.85,duration:.12,ease:"power2.in",immediateRender:false},3.98);tl.to("#flash",{opacity:0,duration:.3},4.1);
pop("#e-q",4.2,null,{y:-50,scale:1});
pop("#e-code",4.7,null,{scale:2.2,rotation:4});
pop("#e-by",5.2,null,{y:40,scale:1});
pop("#e-name",5.35,null,{scale:2.4});
tl.to("#e-name",{scale:1.06,duration:.45,ease:"sine.inOut"},5.55);
tl.to({},{duration:6},0);
window.__timelines=window.__timelines||{};window.__timelines["main"]=tl;
tl.seek(0);renderAt(0);
</script>
</body>
</html>
