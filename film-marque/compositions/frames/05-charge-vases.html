.s05-ring{position:absolute;left:-16px;top:-12px;width:calc(100% + 32px);height:calc(100% + 24px);overflow:visible;pointer-events:none}
.s05-ring path{fill:none;stroke:#8c3b2e;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.s05-anchor{position:absolute;left:100%;top:50%;width:0;height:0}
#s05-link{position:absolute;left:16px;top:-1.5px;width:58px;height:3px;border-radius:2px;background:#8c3b2e;transform-origin:0 50%}
#s05-note{display:grid;justify-items:center;transform-origin:0% 50%}
#s05-note span{grid-area:1/1}
#s05-note-a{opacity:0}
#s05-flash{position:absolute;background:#ffffff;opacity:0}
#s05-black{position:absolute;left:0;top:0;width:1080px;height:1920px;background:#2c2420;opacity:0;z-index:20}
</style>
<div id="s05-ground" class="em-ground clip" data-start="0" data-duration="5.2" data-track-index="0"></div>
<div id="s05-stage" class="em-stage clip" data-start="0" data-duration="5.2" data-track-index="1"></div>
<script id="s05-scene">
(function(){
  var tl = gsap.timeline({ paused: true });
  var st = document.getElementById("s05-stage");

  /* ================= LE MUR (fond, flou 12 px) ================= */
  var W = emBuildWall(st, "s05");
  W.world.setAttribute("data-layout-allow-overflow", "");
  var cam = emCam(W.world);
  /* état hérité des séquences 1 à 3 : pile complète, repères au crayon tracés, croquis tracés pâles */
  [W.marks, W.tally].forEach(function(e){ e.querySelectorAll(".em-pen").forEach(function(p){ p.style.strokeDashoffset = 0; }); });
  gsap.set(W.marks, { opacity: 0.25, scale: 1.25, transformOrigin: "50% 50%" });
  gsap.set(W.months, { opacity: 0.5 });
  [0, 1, 2].forEach(function(i){
    var sk = W.sketches[i];
    sk.querySelectorAll(".em-pen").forEach(function(p){ p.style.strokeDashoffset = 0; });
    sk.querySelector(".em-q").setAttribute("opacity", "1");
    sk.style.opacity = 0.35;
  });
  cam.blur = 12;
  emCamSet(tl, cam, 1500, 1335, 3.00, 0);   /* 1380 - 45 u : la dérive de la séquence 4 (-15 u/s × 3 s) déjà parcourue */
  emCamDrift(tl, cam, 0, -15, 0, 0, 5.20);
  /* plongée : le mur passe de 12 à 18 px de flou */
  tl.fromTo(cam, { blur: 12 }, { blur: 18, duration: 0.80, ease: "power2.in", onUpdate: cam.apply, immediateRender: false }, 4.40);

  /* ================= LE TÉLÉPHONE (couche écran) ================= */
  var P = emBuildPhone(st, "s05");
  var pg = emPageFloue(P.screen, "s05");
  gsap.set(pg, { y: -80 });                         /* défilement hérité de la séquence 4 */
  document.getElementById("s05-pgf-r1").style.color = "#2c2420"; /* « Matière : bois » en encre pleine (séq. 4) */
  var vases = document.getElementById("s05-pgf-vases");
  /* annotations de « bois » héritées de la séquence 4, reconstruites à l'identique (état final : tracées, « aggloméré ») */
  var bois = document.getElementById("s05-pgf-bois");
  bois.insertAdjacentHTML("beforeend",
    '<svg class="s05-ring" id="s05-ring" viewBox="0 0 90 60" preserveAspectRatio="none">' +
    '<path id="s05-ring-c" pathLength="1" stroke-dasharray="1" stroke-dashoffset="0" d="M14 12 C34 2 72 2 84 18 C94 32 82 54 50 57 C20 60 3 48 5 32 C6 22 14 14 30 9"/>' +
    '<path id="s05-ring-x" pathLength="1" stroke-dasharray="1" stroke-dashoffset="0" d="M10 34 L80 27"/></svg>');
  var anchor = emEl("div", "s05-anchor", bois, "s05-anchor");
  var link = emEl("div", "", anchor, "s05-link");
  var N1 = emNote(anchor, "s05-note", '<span id="s05-note-a">bois ?</span><span id="s05-note-b">aggloméré</span>', 74, -34);
  N1.style.opacity = 1;
  var A1 = document.getElementById("s05-ring");

  /* calque d'annotations : enfant du téléphone (suit la caméra-téléphone), hors de l'écran (peut déborder) */
  var ann = emEl("div", "", P.phone, "s05-ann");
  ann.setAttribute("data-layout-allow-overflow", "");
  var flash = emEl("div", "", ann, "s05-flash");
  function svgLayer(id){ var d = emSvg(ann, id, 640, 1300, ""); d.classList.add("s05-a"); return d; }
  var A2 = svgLayer("s05-a-dash");   /* cercle autour du tiret de « Charge » */
  var A2l = svgLayer("s05-a-l2");    /* trait vers « ? » */
  var A3 = svgLayer("s05-a-wave");   /* trait ondulé sous « voir photo » */
  var A4 = svgLayer("s05-a-vases");  /* un même trait autour des deux vases */
  var A4l = svgLayer("s05-a-l4");    /* trait vers « inclus ? » */
  var N2 = emNote(ann, "s05-n2", "?", 0, 0);
  var N4 = emNote(ann, "s05-n4", "inclus ?", 0, 0);

  /* ---- géométrie mesurée sur le DOM (coordonnées locales du téléphone 640 × 1300) ---- */
  var G = { ok: false,
    /* valeurs de secours (Inter chargée), écrasées par la mesure */
    r1: { x: 320, y: 799 }, r2: { x: 320, y: 868 }, ph: { x: 320, y: 427 }, va: { x: 296, y: 397 },
    bois: { l: 205, t: 782, w: 62, h: 36 }, dash: { l: 196, t: 851, w: 18, h: 36 }, voir: { l: 245, t: 920, w: 145, h: 36 },
    photo: { l: 25, t: 212, w: 590, h: 430 }, vb: { l: 185, t: 332, w: 222, h: 130 } };
  function textRect(row){ var tn = row.lastChild; var rg = document.createRange();
    var s = tn.textContent, a = 0; while (a < s.length && /\s/.test(s[a])) a++; rg.setStart(tn, a); rg.setEnd(tn, s.length); return rg.getBoundingClientRect(); }
  function measure(){
    var pr = P.phone.getBoundingClientRect(); if (!(pr.width > 0)) return;
    var k = pr.width / 640;
    function loc(r){ return { l: (r.left - pr.left) / k, t: (r.top - pr.top) / k, w: r.width / k, h: r.height / k }; }
    function ctr(b){ return { x: b.l + b.w / 2, y: b.t + b.h / 2 }; }
    var b1 = loc(document.getElementById("s05-pgf-r1").getBoundingClientRect());
    var b2 = loc(document.getElementById("s05-pgf-r2").getBoundingClientRect());
    G.r1 = { x: 320, y: ctr(b1).y }; G.r2 = { x: 320, y: ctr(b2).y };
    G.photo = loc(document.getElementById("s05-pgf-photo").getBoundingClientRect());
    G.ph = { x: 320, y: ctr(G.photo).y };
    G.vb = loc(vases.getBoundingClientRect()); G.va = ctr(G.vb);
    G.bois = loc(document.getElementById("s05-pgf-bois").getBoundingClientRect());
    G.dash = loc(textRect(document.getElementById("s05-pgf-r2")));
    G.voir = loc(textRect(document.getElementById("s05-pgf-r3")));
    G.ok = (document.fonts && document.fonts.status === "loaded");
    place();
  }
  /* boucle à main levée (déterministe), départ en haut à gauche, dépasse un peu son départ */
  function loop(cx, cy, rx, ry){ var d = "", n = 40, a0 = -2.2, a1 = a0 + Math.PI * 2 + 0.45;
    for (var i = 0; i <= n; i++){ var a = a0 + (a1 - a0) * i / n, f = 1 + 0.035 * Math.sin(3 * a + 1) + 0.03 * i / n;
      d += (i ? " L" : "M") + (cx + Math.cos(a) * rx * f).toFixed(1) + " " + (cy + Math.sin(a) * ry * f).toFixed(1); }
    return d; }
  function wave(x0, x1, y){ var d = "M" + x0.toFixed(1) + " " + y.toFixed(1), step = 12, up = true;
    for (var x = x0; x < x1; x += step){ var xe = Math.min(x + step, x1); d += " Q" + (x + step / 2).toFixed(1) + " " + (y + (up ? -7 : 7)).toFixed(1) + " " + xe.toFixed(1) + " " + y.toFixed(1); up = !up; }
    return d; }
  function paths(layer, classes){ var svg = layer.querySelector("svg"), out = [];
    classes.forEach(function(cl){ var p = document.createElementNS("http://www.w3.org/2000/svg", "path");
      p.setAttribute("class", "em-pen" + (cl ? " " + cl : "")); p.setAttribute("pathLength", "1");
      p.setAttribute("stroke-dasharray", "1"); p.setAttribute("stroke-dashoffset", "1"); svg.appendChild(p); out.push(p); });
    return out; }
  var P2 = paths(A2, [""]), P2l = paths(A2l, ["s05-thin"]),
      P3 = paths(A3, [""]), P4 = paths(A4, [""]), P4l = paths(A4l, ["s05-thin"]);
  function place(){
    /* 2. tiret de « Charge » entouré, relié à « ? » */
    var d = G.dash, dcx = d.l + d.w / 2, dcy = d.t + d.h / 2, drx = Math.max(d.w / 2 + 14, 24), dry = d.h / 2 + 9;
    var n2x = dcx + drx + 70, n2y = dcy - N2.offsetHeight / 2;
    emPos(N2, n2x, n2y);
    P2[0].setAttribute("d", loop(dcx, dcy, drx, dry));
    P2l[0].setAttribute("d", "M" + (dcx + drx) + " " + dcy + " L" + n2x + " " + dcy);
    /* 3. trait ondulé sous « voir photo » */
    var v = G.voir; P3[0].setAttribute("d", wave(v.l - 2, v.l + v.w + 2, v.t + v.h + 4));
    /* 4. les deux vases dans un même trait, reliés à « inclus ? » (sous l'étagère, à gauche de x 960) */
    var q = G.vb, vcx = q.l + q.w / 2, vcy = q.t + q.h / 2 - 4, vrx = q.w / 2 + 40, vry = q.h / 2 + 30;
    var n4x = vcx + 70, n4y = q.t + q.h + 100;
    emPos(N4, n4x, n4y);
    var ex = vcx + vrx * Math.cos(0.9), ey = vcy + vry * Math.sin(0.9);
    P4[0].setAttribute("d", loop(vcx, vcy, vrx, vry));
    P4l[0].setAttribute("d", "M" + ex.toFixed(1) + " " + ey.toFixed(1) + " L" + (n4x + 40) + " " + n4y);
    /* flash blanc posé sur la photo */
    emPos(flash, G.photo.l, G.photo.t, G.photo.w, G.photo.h);
  }

  /* ---- caméra-téléphone : un point focal (mélange pondéré d'ancres mesurées) posé en (X, Y) à l'échelle s ---- */
  var c = { w0: 0, w1: 0, w2: 0, w3: 0, X: 560, Y: 700, s: 1.15, blur: 0, r: 0 };
  c.apply = function(){
    if (!G.ok) measure();
    var A = [G.r1, G.r2, G.ph, G.va], ws = [c.w0, c.w1, c.w2, c.w3], fx = 0, fy = 0, sw = 0;
    for (var i = 0; i < 4; i++){ fx += ws[i] * A[i].x; fy += ws[i] * A[i].y; sw += ws[i]; }
    if (sw > 0){ fx /= sw; fy /= sw; } else { fx = 320; fy = 650; }
    var px = c.X - 320 - (fx - 320) * c.s, py = c.Y - 650 - (fy - 650) * c.s, ps = c.s;
    if (c.r > 0){ /* départ du cran de la séquence 4 : x 240, r1 à y 720 à l'échelle 1,15 puis dérive (y -6 px/s, échelle +0,02/s, 1,8 s) */
      var Yd = 720 - (G.r1.y - 650) * 1.15 - 650 - 6 * 1.8, Sd = 1.15 + 0.02 * 1.8;
      px += (240 - px) * c.r; py += (Yd - py) * c.r; ps += (Sd - ps) * c.r; }
    gsap.set(P.phone, { x: px, y: py, scale: ps,
      filter: c.blur > 0.05 ? "blur(" + c.blur.toFixed(2) + "px)" : "none" });
  };
  measure();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ G.ok = false; measure(); c.apply(); });

  /* fin du cran de la séquence 4 (power3.inOut 0,6 s entamé à 2.60) : il reste son dernier tiers */
  var p3io = gsap.parseEase("power3.inOut");
  var U0 = 2 / 3, E0 = p3io(U0);
  function tailEase(t){ return (p3io(U0 + (1 - U0) * t) - E0) / (1 - E0); }
  /* arrivée du cran : x 240 (X 560), ligne r2 à y 700, échelle 1,15 ; r = part restante du départ (1 - power3.inOut) */
  tl.fromTo(c, { w0: 0, w1: 1, w2: 0, w3: 0, X: 560, Y: 700, s: 1.15, blur: 0, r: 1 - E0 },
    { r: 0, duration: 0.20, ease: tailEase, onUpdate: c.apply }, 0);
  /* dérive 0.20 à 1.40 : échelle +0,02/s */
  tl.fromTo(c, { s: 1.15 }, { s: 1.174, duration: 1.20, ease: "none", onUpdate: c.apply, immediateRender: false }, 0.20);
  /* 1.40 à 2.10 : cran vers la photo (le téléphone redescend), échelle → 1,30 */
  tl.fromTo(c, { w1: 1, w2: 0, X: 560, Y: 700, s: 1.174 }, { w1: 0, w2: 1, X: 540, Y: 520, s: 1.30, duration: 0.70, ease: "power3.inOut", onUpdate: c.apply, immediateRender: false }, 1.40);
  /* dérive 2.10 à 4.40 : échelle +0,03/s, x -4 px/s */
  tl.fromTo(c, { X: 540, s: 1.30 }, { X: 530.8, s: 1.369, duration: 2.30, ease: "none", onUpdate: c.apply, immediateRender: false }, 2.10);
  /* 4.40 à 5.20 : plongée power2.in vers 3,40 centrée sur les vases, flou 0 → 6 → 0 */
  tl.fromTo(c, { w2: 1, w3: 0, X: 530.8, Y: 520, s: 1.369 }, { w2: 0, w3: 1, X: 540, Y: 960, s: 3.40, duration: 0.80, ease: "power2.in", onUpdate: c.apply, immediateRender: false }, 4.40);
  tl.fromTo(c, { blur: 0 }, { blur: 6, duration: 0.40, ease: "power2.in", onUpdate: c.apply, immediateRender: false }, 4.40);
  tl.fromTo(c, { blur: 6 }, { blur: 0, duration: 0.40, ease: "power2.out", onUpdate: c.apply, immediateRender: false }, 4.80);

  /* ================= SCÈNE 1 : la charge ? introuvable ================= */
  /* 0.30 cercle brique autour du tiret (0,25 s) */
  tl.set(A2, { opacity: 1 }, 0.30);
  emPen(tl, A2, 0.30, 0.25);
  /* 0.55 étiquette « ? » reliée (×1,2 flou 8 → net) */
  tl.set(A2l, { opacity: 1 }, 0.52);
  emPen(tl, A2l, 0.52, 0.12);
  tl.fromTo(N2, { opacity: 0, scale: 1.2, filter: "blur(8px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.18, ease: "expo.out", immediateRender: false }, 0.55);
  /* 0.90 « Introuvable. » : l'étiquette tremble deux fois */
  tl.to(N2, { x: 4, duration: 0.05, ease: "power1.out" }, 0.90);
  tl.to(N2, { x: -4, duration: 0.05, ease: "power1.inOut" }, 0.95);
  tl.to(N2, { x: 4, duration: 0.05, ease: "power1.inOut" }, 1.00);
  tl.to(N2, { x: 0, duration: 0.05, ease: "power1.out" }, 1.05);
  /* 1.20 trait ondulé brique sous « voir photo » (0,25 s) */
  tl.set(A3, { opacity: 1 }, 1.20);
  emPen(tl, A3, 1.20, 0.25);

  /* ================= SCÈNE 2 : les vases de la photo ================= */
  /* 2.50 « photo, » : flash blanc très bref */
  tl.fromTo(flash, { opacity: 0 }, { opacity: 0.35, duration: 0.08, ease: "power2.out", immediateRender: false }, 2.50);
  tl.to(flash, { opacity: 0, duration: 0.12, ease: "power2.in" }, 2.58);
  /* 3.00 les deux vases entourés d'un même trait (0,3 s) */
  tl.set(A4, { opacity: 1 }, 3.00);
  emPen(tl, A4, 3.00, 0.30);
  /* 3.30 « vases » : les vases montent de 6 px */
  tl.fromTo(vases, { y: 0 }, { y: -6, duration: 0.25, ease: "power3.out", immediateRender: false }, 3.30);
  /* 3.60 étiquette « inclus ? » reliée */
  tl.set(A4l, { opacity: 1 }, 3.57);
  emPen(tl, A4l, 3.57, 0.12);
  tl.fromTo(N4, { opacity: 0, scale: 1.2, filter: "blur(8px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.18, ease: "expo.out", immediateRender: false }, 3.60);
  /* 4.00 « fournis. » : l'étiquette donne un coup */
  tl.to(N4, { scale: 1.06, duration: 0.10, ease: "power2.out" }, 4.00);
  tl.to(N4, { scale: 1, duration: 0.10, ease: "power2.in" }, 4.10);
  /* 4.30 les annotations s'effacent vite */
  tl.to(link, { opacity: 0, duration: 0.15, ease: "power2.in" }, 4.30);
  tl.to([A1, N1, A2, A2l, N2, A3, A4, A4l, N4], { opacity: 0, duration: 0.15, ease: "power2.in" }, 4.30);
  /* 4.75 l'écran s'éteint : calque .off 0 → 1 */
  tl.fromTo(P.off, { opacity: 0 }, { opacity: 1, duration: 0.30, ease: "power2.inOut", immediateRender: false }, 4.75);

  /* ================= SOUS-TITRES (bande y 1360 à 1520) ================= */
  var SA = emSub(st, "s05-sub1", ["La", "charge ?", "Introuvable."], 2, -1);
  var SB = emSub(st, "s05-sub2", ["Et", "sur", "la", "photo,", "les", "vases", "ont", "l’air", "fournis."], 8, -1);
  emSubTL(tl, SA, [0.10, 0.24, 0.90], 2, -1, 1.60);
  emSubTL(tl, SB, [2.10, 2.22, 2.38, 2.50, 3.10, 3.24, 3.66, 3.80, 4.00], 8, -1, 4.70);

  /* sécurité : plein cadre brun sous rien d'autre, 5.00 à 5.10 */
  var black = emEl("div", "", st, "s05-black");
  tl.fromTo(black, { opacity: 0 }, { opacity: 1, duration: 0.10, ease: "none", immediateRender: false }, 5.00);

  tl.set({}, {}, 5.20);
  window.__timelines = window.__timelines || {};
  window.__timelines["05-charge-vases"] = tl;
})();
</script>
</div>
</template>
