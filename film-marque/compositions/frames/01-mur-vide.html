  /* le dossier du canapé est flou (avant-plan) avant d'entrer */
  W.sofa.style.filter = "blur(4px)";

  /* ---------- caméra ---------- */
  /* handoff_in : cam(1250, 1180, 1.60) */
  emCamSet(tl, cam, 1250, 1180, 1.60, 0);
  /* P1 : dérive x +40, y +12, échelle -0,03/s */
  emCamDrift(tl, cam, 40, 12, -0.03, 0, 2.30);
  /* 2.30 : la dérive acquise passe dans la base (aucun saut) */
  tl.set(cam, { x: 1342, y: 1207.6, s: 1.531, onUpdate: cam.apply, onComplete: cam.apply }, 2.30);
  /* P2 : dérive x +20, échelle -0,01/s jusqu'au cran */
  emCamDrift(tl, cam, 20, 0, -0.01, 2.30, 4.90);
  /* 2.30 à 3.20 : recul (image = cam(1500, 1450, 0.75) dérive comprise) */
  emCamTo(tl, cam, 1482, 1450, 0.759, 2.30, 0.90, "expo.out");
  /* 3.40 à 4.30 : descente (image = cam(1500, 1700, 0.50) à 4.90, dérive comprise) */
  emCamTo(tl, cam, 1448, 1700, 0.526, 3.40, 0.90, "power3.inOut");
  /* 4.90 : dérive 0, base exactement cam(1500, 1700, 0.50) */
  tl.set(cam, { x: 1500, y: 1700, s: 0.50, dx: 0, dy: 0, ds: 0, onUpdate: cam.apply, onComplete: cam.apply }, 4.90);
  /* 4.90 : cran à droite vers la commode (à mi-course à 5.40) */
  emCamTo(tl, cam, 2900, 2050, 1.10, 4.90, 0.85, "power3.inOut", 6);

  /* ---------- P1 : le compte au crayon et « 6 mois » ---------- */
  /* tally : 5 traits (60 u chacun), la barre (174,6 u), le sixième (60 u) ; total 534,6 u, pathLength 1 */
  var tallyPath = W.tally.querySelector(".em-pen");
  var TOT = 534.6;
  function tallyTo(drawn, at, dur){ tl.to(tallyPath, { strokeDashoffset: 1 - drawn / TOT, duration: dur, ease: "power2.out" }, at); }
  tallyTo(59, 0.05, 0.12);
  tallyTo(119, 0.20, 0.12);
  tallyTo(179, 0.35, 0.12);
  tallyTo(239, 0.50, 0.12);
  tallyTo(299, 0.62, 0.12);
  tallyTo(474, 0.76, 0.16);
  tallyTo(TOT, 1.10, 0.12);
  tl.to(W.tally, { opacity: 0.8, duration: 0.4, ease: "power1.out" }, 1.90);

  /* « 6 mois » : trop grand x1,2, flou 8 -> net en 0,2 s */
  tl.fromTo(W.months,
    { opacity: 0, scale: 1.2, rotation: -3, filter: "blur(8px)" },
    { opacity: 1, scale: 1, rotation: -3, filter: "blur(0px)", duration: 0.2, ease: "expo.out", immediateRender: false }, 0.30);

  /* repères : 4 coins (8 x 30 u = 240 u) puis la croix (280 u) ; total 520 u */
  var marksPath = W.marks.querySelector(".em-pen");
  var MT = 520;
  tl.to(marksPath, { strokeDashoffset: 1 - 179 / MT, duration: 0.9, ease: "none" }, 1.40);
  tl.to(marksPath, { strokeDashoffset: 1 - 239 / MT, duration: 0.18, ease: "power2.out" }, 2.52);
  tl.to(marksPath, { strokeDashoffset: 0, duration: 0.25, ease: "power2.out" }, 3.10);
  /* 4.86 « vide. » : les repères pâlissent d'un coup */
  tl.to(W.marks, { opacity: 0.55, duration: 0.15, ease: "power2.out" }, 4.86);

  /* ---------- P2 : le canapé ---------- */
  tl.to(W.sofa, { filter: "blur(0px)", duration: 0.6, ease: "power2.out" }, 3.50);
  var cush = [0, 1, 2].map(function(i){ return document.getElementById("s01-cush" + i); });
  tl.to(cush, { y: 6, duration: 0.07, ease: "power2.in" }, 3.90);
  tl.to(cush, { y: 0, duration: 0.2, ease: "power3.out" }, 3.97);

  /* ---------- sous-titres ---------- */
  var w1 = ["Six", "mois", "que", "vous", "avez", "emménagé."];
  var S1 = emSub(stage, "s01-sub1", w1, 1, -1);
  emSubTL(tl, S1, [0.30, 0.52, 0.86, 0.98, 1.16, 1.36], 1, -1, 2.10);
  var w2 = ["Et", "le", "mur", "au-dessus", "du", "canapé…", "est", "toujours", "vide."];
  var S2 = emSub(stage, "s01-sub2", w2, -1, 8);
  /* sortie lancée à 5.12 : rien en bas dès 5.30 (handoff_out) */
  emSubTL(tl, S2, [2.40, 2.52, 2.64, 2.92, 3.38, 3.52, 4.30, 4.48, 4.86], -1, 8, 5.12);

  /* durée exacte du plan */
  tl.set({}, {}, 5.40);
